# Render blueprint. With this file in the repo, Render configures the whole
# service itself: New + → Blueprint → pick this repo.
#
# NOTE ON THE FREE PLAN: the disk is ephemeral. Anything uploaded through the
# admin — photos, events, edits — is wiped whenever the service redeploys or
# wakes from sleep. build.sh re-seeds the starting content each time, so the
# site always comes back looking right, but committee edits will not survive.
# Fine for showing people the site; switch to the Starter plan plus a disk
# before anyone relies on it. See HOSTING.md.
services:
  - type: web
    name: sikh-center-website
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn gurdwara_site.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DJANGO_DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"

      # Render generates a strong random key on first deploy.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # sync: false means "ask me for this value when creating the blueprint".
      # Render only prompts for variables declared here, which is why these
      # have to be listed rather than added in the dashboard afterwards.
      #
      # These three create the admin login (see build.sh). The password is
      # entered into Render and stored there — it never enters this repo.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
